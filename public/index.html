<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>A.N.I.S</title>
        <link rel="stylesheet" href="../styles/style.css">
    </head>
    <body>
        <div class="top_bar">
            <div class="left_items">
                <h3>Acoustic Neural Input System</h3>
            </div>
            <div class="spacer"></div>
            <div class="right_items">
                
                <button id="theme-toggle">
                    <img id='mode' src="../Icons/moon.png" width="24" height="24">
                </button>
            </div>
        </div>
        <div id="main-content">
            <div id='brainmode-div'class="main-content-container active">
                <table class="main-content-table">
                    <tr>
                        <td colspan="2">
                        <h4>  Vertical EOG Signal </h4>
                        <div id="eeg-panel1">
                        <canvas id="eegChart1" width="500" height="200"></canvas>
                        </div>
                        </td>
                        <td>
                            <div class="dpad">
                                    <div class="arrow up" id="up">↑</div>
                                    <div class="middle">
                                        <div class="arrow left" id="left">←</div>
                                        <div class="center"></div>
                                        <div class="arrow right" id="right">→</div>
                                    </div>

                                    <div class="arrow down" id="down">↓</div>

                            </div>
                        </td>
                       
                    </tr>
                    <tr>
                        <td colspan="2">
                            <h4>Horizontal EOG Signal</h4>
                                <div id="eeg-panel2">
                                <canvas id="eegChart2" width="500" height="200"></canvas>
                                </div>
                        </td>

                        <td>
                            <div id="eeg-settings-panel">
                                <h3>EOG Settings</h3>

                                <div class="settings-grid-2x2">
                                <!-- Row 1 -->
                                <div class="grid-item">
                                    <label for="move-amount">Move Amount:</label>
                                    <input type="number" id="move-amount" value="2" step="1">
                                </div>

                                <div class="grid-item">
                                    <label for="slope-threshold">Slope Threshold:</label>
                                    <input type="number" id="slope-threshold" value="0.1" step="0.01">
                                </div>

                                <!-- Row 2 -->
                                <div class="grid-item">
                                    <label for="neutral-zone">Neutral Zone:</label>
                                    <input type="number" id="neutral-zone" value="0.06" step="0.01">
                                </div>

                                <br>                            

                                    <button id="save-settings">Save</button>
                                </div>
                        </td>
                
                    </tr>
                    <tr>
                        
                    </tr>                    
                </table>
                
            </div>
            <div id='voicemode-div' class="main-content-container">
                <div class="notfound">
                    <img class='not-found-image' src="../Icons/not-found.png"height='24' width="24">
                    <p>Sorry Not found</p>
                </div>
                
            </div>
        </div>
        
        
        
        <script src="../libs/smoothie.js"></script>
        <script src="../src/renderer.js"></script>
    </body>
</html>
